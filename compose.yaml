services:
  postgres:
    image: postgres:17.11
    container_name: gateway-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: gateway_users
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_users"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8.2.10
    container_name: gateway-redis
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  postgres_password:
    file: ./.secrets/postgres_password.txt

volumes:
  postgres-data:
    name: gateway-postgres-data
