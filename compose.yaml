services:
  postgres:
    image: postgres:17.11
    container_name: gateway-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: gateway_users
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_users"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: gateway-keycloak
    command: [ "start-dev" ]
    env_file:
      - ./.secrets/keycloak.env
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data


secrets:
  postgres_password:
    file: ./.secrets/postgres_password.txt

volumes:
  postgres-data:
    name: gateway-postgres-data
  keycloak-data:
    name: gateway-keycloak-data

