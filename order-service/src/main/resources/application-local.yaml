spring:
  config:
    import: "configtree:./.secrets/"



  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/gateway_orders
    username: order_app
    password: "${order_password.txt}"

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8091
          jwk-set-uri: http://127.0.0.1:8091/.well-known/jwks.json
          audiences:
            - gateway-api
          jws-algorithms:
            - RS256

clients:
  user:
    base-url: http://127.0.0.1:8081
  product:
    base-url: http://127.0.0.1:8082
